<svg xmlns="http://www.w3.org/2000/svg" width="800" height="169" viewBox="0 0 800 169">
  <style>
    .pf-leaf { transform-origin: 753.5px 40.5px; animation: pf-bob 6s ease-in-out infinite; }
    
    .pf-header { animation: pf-pop 12s ease-out infinite; }
    .pf-underline { animation: pf-wipe 12s ease-out infinite; transform-origin: 36px center; }
    .pf-line { animation: pf-pop 12s ease-out infinite; }
    .pf-line-0 { animation-delay: 1.80s; }
    .pf-line-1 { animation-delay: 2.40s; }
    .pf-line-2 { animation-delay: 3.00s; }
    
    @keyframes pf-pop {
      0%, 6%   { opacity: 0; transform: translateY(-4px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes pf-wipe {
      0%, 10%  { transform: scaleX(0); }
      28%, 88% { transform: scaleX(1); }
      100%     { transform: scaleX(1); }
    }
    @keyframes pf-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2px); }
    }
  </style>

