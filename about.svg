  <!-- body (wrapped bio) -->
  <text class="pf-line pf-line-0" x="36" y="98" fill="#3d2818" font-family="ui-monospace, monospace" font-size="14" font-weight="500" letter-spacing="0.5">Cloud &amp; DevOps enthusiast building hands-on experience with AWS, Linux,</text>
  <text class="pf-line pf-line-1" x="36" y="120" fill="#3d2818" font-family="ui-monospace, monospace" font-size="14" font-weight="500" letter-spacing="0.5">Docker, and cloud infrastructure. Currently learning Kubernetes, Terraform,</text>
  <text class="pf-line pf-line-2" x="36" y="142" fill="#3d2818" font-family="ui-monospace, monospace" font-size="14" font-weight="500" letter-spacing="0.5">and CI/CD while turning ideas into reliable, automated deployments.</text>

